name: sign readme

on:
  schedule:
    - cron: '0 6 * * *'   # re-verify daily even without content changes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import PGP key
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
        run: |
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import

      - name: Extract stable content and hash it
        id: extract
        run: |
          HASH="$(python3 scripts/sign_extract_stable.py)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Sign stable content
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$PGP_PASSPHRASE" \
            --detach-sign --armor \
            -o README.stable.md.sig README.stable.md

      - name: Update README SIG block
        env:
          TIMESTAMP_VAL: ${{ github.event.repository.updated_at }}
          HASH_VAL: ${{ steps.extract.outputs.hash }}
        run: |
          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SIG_URL="https://github.com/${{ github.repository }}/blob/main/README.stable.md.sig"
          python3 scripts/sign_update_readme.py --timestamp "$TS" --hash "$HASH_VAL" --sig-url "$SIG_URL"

      - name: Commit if changed
        run: |
          git config user.name "sign-bot"
          git config user.email "sign-bot@users.noreply.github.com"
          git add README.md README.stable.md README.stable.md.sig
          git diff --cached --quiet || git commit -m "sign: verify README integrity $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
