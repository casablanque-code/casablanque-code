name: sign readme

on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import PGP key
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
        run: echo "$PGP_PRIVATE_KEY" | gpg --batch --import

      - name: Sign README.md
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$PGP_PASSPHRASE" \
            --detach-sign --armor \
            -o README.md.sig README.md

      - name: Commit signature if changed
        run: |
          git config user.name "sign-bot"
          git config user.email "sign-bot@users.noreply.github.com"
          git add README.md.sig
          git diff --cached --quiet || git commit -m "sign: README.md"
          git push
